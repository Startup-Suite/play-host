name: Darwin

on:
  push:
  pull_request:

jobs:
  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - run: GOOS=darwin GOARCH=amd64 go vet ./...
      - run: CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -o /tmp/play-host-darwin-amd64 ./cmd/play-host
